/// This is the main HTML file that serves as the entry point for the React application. It includes a splash screen that is displayed while the app is loading, and then it renders the main React component into the root div. The splash scr


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rehacktor | Game Radar</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top center, rgb(192 132 252 / 0.16), transparent 24%),
          radial-gradient(circle at 16% 18%, rgb(139 92 246 / 0.2), transparent 26%),
          radial-gradient(circle at 82% 20%, rgb(236 72 153 / 0.14), transparent 22%),
          linear-gradient(180deg, #120f2c 0%, #080713 46%, #050510 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }

      .splash-logo {
        display: block;
        width: min(30vw, 11rem);
        min-width: 6rem;
        height: min(30vw, 11rem);
        min-height: 6rem;
        aspect-ratio: 1 / 1;
        border: 0;
        background: transparent;
        filter: drop-shadow(0 0 32px rgb(139 92 246 / 0.28));
      }

      .splash-copy {
        font-family: Roboto, sans-serif;
        color: #f5f3ff;
      }

      .splash-copy small {
        display: block;
        margin-bottom: 0.6rem;
        font-size: 0.72rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #c084fc;
      }

      .splash-copy strong {
        display: block;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-shell">
        <iframe
          class="splash-logo"
          src="/logo_animato.svg"
          title="Rehacktor logo"
        ></iframe>
        <div class="splash-copy">
          <small>rehacktor pulse</small>
          <strong>Rehacktor</strong>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
